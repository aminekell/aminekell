<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">Amine Kella — systems, backend, security</title><desc id="desc">A cinematic neon profile banner with a 3D API systems cube, orbital light trails, and an animated title sweep.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse"><stop stop-color="#050907"/><stop offset=".52" stop-color="#071316"/><stop offset="1" stop-color="#100D1A"/></linearGradient>
<linearGradient id="lime" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#D3FF5C"/><stop offset="1" stop-color="#42F5B5"/></linearGradient>
<linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#B9FF55" stop-opacity="0"/><stop offset=".45" stop-color="#E9FFC4" stop-opacity=".9"/><stop offset="1" stop-color="#4BFFE0" stop-opacity="0"/></linearGradient>
<linearGradient id="top" x1="757" y1="111" x2="1020" y2="225" gradientUnits="userSpaceOnUse"><stop stop-color="#D8FF70"/><stop offset="1" stop-color="#41FFD0"/></linearGradient>
<linearGradient id="left" x1="757" y1="193" x2="890" y2="355" gradientUnits="userSpaceOnUse"><stop stop-color="#0E9B70"/><stop offset="1" stop-color="#073D35"/></linearGradient>
<linearGradient id="right" x1="890" y1="193" x2="1020" y2="355" gradientUnits="userSpaceOnUse"><stop stop-color="#148DB2"/><stop offset="1" stop-color="#472C80"/></linearGradient>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" stroke="#88FFD8" stroke-opacity=".075"/></pattern>
<pattern id="scan" width="1" height="6" patternUnits="userSpaceOnUse"><path d="M0 0H1" stroke="#DFFFEA" stroke-opacity=".045"/></pattern>
<filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<clipPath id="titleMask"><text x="62" y="199" font-family="Arial,sans-serif" font-size="62" font-weight="800" letter-spacing="1.5">AMINE KELLA</text></clipPath>
</defs>
<rect width="1200" height="420" rx="24" fill="url(#bg)"/><rect width="1200" height="420" rx="24" fill="url(#grid)"/><rect width="1200" height="420" rx="24" fill="url(#scan)"/>
<path d="M0 332H594L658 268H730" stroke="#58FFC6" stroke-opacity=".55" stroke-width="1.2"/><path d="M0 342H586L664 264" stroke="#BCFF5A" stroke-opacity=".12"/>
<circle cx="658" cy="268" r="3.5" fill="#D3FF5C" filter="url(#glow)"/>
<rect x="62" y="46" width="402" height="28" rx="14" fill="#0D2119" stroke="#9BFF55" stroke-opacity=".55"/><circle cx="80" cy="60" r="3.5" fill="#BFFF59" filter="url(#glow)"/><text x="94" y="64" fill="#C6FBA4" font-family="Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="1.5">1337 KHOURIBGA  ·  ALX SOFTWARE ENGINEERING</text>
<text x="62" y="135" fill="#85A99A" font-family="Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="3">SOFTWARE ENGINEERING / FIELD NOTES 01</text>
<text x="62" y="199" fill="#EFF8F3" font-family="Arial,sans-serif" font-size="62" font-weight="800" letter-spacing="1.5">AMINE KELLA</text>
<rect x="55" y="125" width="360" height="82" fill="url(#shine)" clip-path="url(#titleMask)" opacity=".5"><animate attributeName="x" values="-420;650" dur="7s" repeatCount="indefinite"/></rect>
<path d="M63 218H250" stroke="url(#lime)" stroke-width="3" stroke-linecap="round"><animate attributeName="stroke-dasharray" values="12 175;175 12;12 175" dur="5s" repeatCount="indefinite"/></path>
<text x="62" y="253" fill="#EAF6EE" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="1.3">SYSTEMS  ·  BACKEND  ·  APPLICATION SECURITY</text>
<text x="62" y="282" fill="#92A89D" font-family="Arial,sans-serif" font-size="13">I build to understand what happens beneath the interface.</text>
<g font-family="Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="1.1">
<rect x="62" y="305" width="60" height="25" rx="12.5" fill="#10271D" stroke="#78F567" stroke-opacity=".6"/><text x="92" y="321" text-anchor="middle" fill="#BDFF9B">C / C++</text>
<rect x="132" y="305" width="61" height="25" rx="12.5" fill="#10251F" stroke="#5DF6BD" stroke-opacity=".6"/><text x="162" y="321" text-anchor="middle" fill="#A9FFE2">JAVA</text>
<rect x="203" y="305" width="87" height="25" rx="12.5" fill="#10252C" stroke="#51DEED" stroke-opacity=".55"/><text x="246" y="321" text-anchor="middle" fill="#A6F9FF">DOCKER</text>
<rect x="300" y="305" width="99" height="25" rx="12.5" fill="#1A1730" stroke="#A78BFF" stroke-opacity=".55"/><text x="349" y="321" text-anchor="middle" fill="#D3C7FF">NETWORKS</text>
</g>
<text x="62" y="382" fill="#74A592" font-family="Arial,sans-serif" font-size="9" font-weight="700" letter-spacing="2">BUILD  /  TRACE  /  IMPROVE</text>
<!-- orbiting 3D systems cube -->
<ellipse cx="890" cy="230" rx="210" ry="82" transform="rotate(-27 890 230)" stroke="#51F5C2" stroke-opacity=".32"/><ellipse cx="890" cy="230" rx="176" ry="112" transform="rotate(31 890 230)" stroke="#89E7FF" stroke-opacity=".23"/>
<path d="M757 191 890 128 1020 191 890 254 757 191Z" fill="url(#top)" stroke="#D9FF9A" stroke-opacity=".8"/>
<path d="M757 191 890 254V355L757 291V191Z" fill="url(#left)" stroke="#70FFC8" stroke-opacity=".65"/>
<path d="M890 254 1020 191V291L890 355V254Z" fill="url(#right)" stroke="#8DEBFF" stroke-opacity=".58"/>
<path d="M757 291 890 355 1020 291" stroke="#A9FFE0" stroke-opacity=".25"/>
<text x="890" y="194" text-anchor="middle" fill="#081A13" font-family="Arial,sans-serif" font-size="13" font-weight="800" letter-spacing="2">API</text>
<text x="821" y="286" text-anchor="middle" fill="#E3FFE9" font-family="Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">SYSTEMS</text>
<text x="956" y="286" text-anchor="middle" fill="#F3EEFF" font-family="Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">DATA</text>
<circle cx="890" cy="254" r="6" fill="#F3FFE6" filter="url(#glow)"><animate attributeName="r" values="4;8;4" dur="2.4s" repeatCount="indefinite"/></circle>
<circle r="4" fill="#D5FF5E" filter="url(#glow)"><animateMotion dur="6s" repeatCount="indefinite" path="M679 221A210 82 -27 1 0 1101 239A210 82 -27 1 0 679 221"/></circle>
<circle r="3" fill="#63F4FF" filter="url(#glow)"><animateMotion dur="8s" begin="-3s" repeatCount="indefinite" path="M714 179A176 112 31 1 0 1066 281A176 112 31 1 0 714 179"/></circle>
<text x="1115" y="382" text-anchor="end" fill="#678377" font-family="Arial,sans-serif" font-size="9" letter-spacing="1.5">AMINEKELL / PROFILE</text>
</svg>
