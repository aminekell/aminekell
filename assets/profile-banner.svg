<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">Amine Kella — Backend and Systems Developer</title>
<desc id="desc">An animated neon isometric cube with orbiting data nodes, representing backend systems, APIs, and software engineering.</desc>
