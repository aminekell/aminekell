<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
<title id="title">Concurrency and fractals: Philosophers and fract-ol</title>
<desc id="desc">Two animated concept scenes: Philosophers models several agents sharing a limited set of table resources; fract-ol explores how repeated complex-plane calculations form intricate fractal boundaries.</desc>
<defs><linearGradient id="bg" x2="0" y2="1"><stop stop-color="#09151e"/><stop offset="1" stop-color="#03070b"/></linearGradient><linearGradient id="cyan" x2="1"><stop stop-color="#2cebd2"/><stop offset="1" stop-color="#68ffc0"/></linearGradient><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#64ffca" stroke-opacity=".055"/></pattern><filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
<rect width="1200" height="440" rx="24" fill="url(#bg)"/><rect width="1200" height="440" rx="24" fill="url(#grid)"/><text x="40" y="42" fill="#75ffd2" font-family="monospace" font-size="13" letter-spacing="3">PARALLEL WORLDS / TWO IDEAS</text><path d="M30 64H1170" stroke="#49eec8" stroke-opacity=".24"/>
<g transform="translate(36 86)" font-family="monospace"><rect width="548" height="314" rx="18" fill="#07131b" stroke="#39cdb3" stroke-opacity=".5"/><text x="24" y="36" fill="#f1fff9" font-size="18" font-weight="700">PHILOSOPHERS</text><text x="24" y="58" fill="#91b8b3" font-size="12">Agents coordinate access to shared resources</text><ellipse cx="278" cy="190" rx="140" ry="90" fill="#0d2931" stroke="#53f9d1" stroke-opacity=".62" stroke-width="2"/><ellipse cx="278" cy="190" rx="88" ry="52" fill="#08151b" stroke="#986cff" stroke-opacity=".6" stroke-dasharray="4 7"/><text x="278" y="184" text-anchor="middle" fill="#c5fff0" font-size="12">shared table</text><text x="278" y="203" text-anchor="middle" fill="#8fa9b5" font-size="10">limited resources</text>
<g fill="#171e34" stroke="#9584ff" stroke-width="2"><circle cx="278" cy="92" r="19"/><circle cx="394" cy="155" r="19"/><circle cx="350" cy="280" r="19"/><circle cx="205" cy="280" r="19"/><circle cx="162" cy="155" r="19"/></g><g fill="#8f82ff"><circle cx="278" cy="92" r="5"/><circle cx="394" cy="155" r="5"/><circle cx="350" cy="280" r="5"/><circle cx="205" cy="280" r="5"/><circle cx="162" cy="155" r="5"/></g><g stroke="#62ffd4" stroke-width="6" stroke-linecap="round"><path d="M232 116v25"/><path d="M343 146l-20 18"/><path d="M326 245l-23-11"/><path d="M229 245l23-11"/><path d="M213 146l20 18"/></g><g fill="#63ffd6" filter="url(#glow)"><circle cx="232" cy="131" r="4"><animate attributeName="opacity" values=".25;1;.25" dur="2s" repeatCount="indefinite"/></circle><circle cx="343" cy="156" r="4"><animate attributeName="opacity" values="1;.25;1" dur="2s" repeatCount="indefinite"/></circle></g><text x="24" y="292" fill="#72e4ce" font-size="10" letter-spacing="1">ORDER · WAIT · SHARE · CONTINUE</text></g>
<g transform="translate(616 86)" font-family="monospace"><rect width="548" height="314" rx="18" fill="#07131b" stroke="#7163d5" stroke-opacity=".65"/><text x="24" y="36" fill="#f1fff9" font-size="18" font-weight="700">FRACT-OL</text><text x="24" y="58" fill="#91b8b3" font-size="12">Repeated calculations reveal a boundary</text><rect x="35" y="82" width="310" height="192" rx="8" fill="#081c25" stroke="#4beed0" stroke-opacity=".5"/><path d="M47 110H333M47 148H333M47 186H333M47 224H333M86 91V264M125 91V264M164 91V264M203 91V264M242 91V264M281 91V264M320 91V264" stroke="#47ddcc" stroke-opacity=".12"/>
