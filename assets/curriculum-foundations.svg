<path d="M249 112l31-14 31 14-31 14z" fill="#184f58" stroke="#5effd8"/><path d="M249 112v14l31 14v-14z" fill="#0d2a35" stroke="#5effd8"/><path d="M280 126v14l31-14v-14z" fill="#174253" stroke="#5effd8"/><path d="M250 100l30-13 30 13-30 14z" fill="#273b5b" stroke="#9e8aff"/><path d="M250 100v12l30 14v-12z" fill="#162b43" stroke="#9e8aff"/><path d="M280 114v12l30-14v-12z" fill="#25345b" stroke="#9e8aff"/><path d="M255 84l29-13 29 13-29 13z" fill="#21534c" stroke="#5effd8"/><path d="M255 84v16l29 14V97z" fill="#10352f" stroke="#5effd8"/><path d="M284 97v17l29-14V84z" fill="#17433d" stroke="#5effd8"/><path d="M320 69v45" stroke="#a997ff" stroke-width="2" marker-end="url(#farr)"/>
