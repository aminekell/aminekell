<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
<title id="title">1337 foundations: Born2beroot and five C projects</title>
<desc id="desc">A six-part isometric concept map: Born2beroot hardens a virtual Linux server; Libft builds reusable C utilities; ft_printf formats values; get_next_line reads buffered lines; minitalk sends bits between processes; push_swap sorts using two stacks and limited operations.</desc>
<defs>
  <linearGradient id="fb" x2="0" y2="1"><stop stop-color="#07111a"/><stop offset="1" stop-color="#03070b"/></linearGradient>
  <linearGradient id="fg" x2="1" y2="1"><stop stop-color="#45ffd0"/><stop offset="1" stop-color="#4ddd91"/></linearGradient>
  <pattern id="fgrid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#71ffc1" stroke-opacity=".05"/></pattern>
  <filter id="fglow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<marker id="farr" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#a997ff"/></marker></defs>
<rect width="1200" height="460" rx="24" fill="url(#fb)"/><rect width="1200" height="460" rx="24" fill="url(#fgrid)"/>
<text x="44" y="42" fill="#72ffcf" font-family="monospace" font-size="13" letter-spacing="3">1337 / FOUNDATIONS</text><text x="1154" y="42" text-anchor="end" fill="#7696a5" font-family="monospace" font-size="12" letter-spacing="2">LINUX + C</text><path d="M28 65H1172" stroke="#37f6c4" stroke-opacity=".18"/>
