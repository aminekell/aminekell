<g transform="translate(425 268)" font-family="monospace">
<rect width="350" height="160" rx="14" fill="#081720" stroke="#2b907f" stroke-opacity=".6"/><text x="18" y="32" fill="#eafff7" font-size="16" font-weight="700">MINITALK</text><text x="18" y="54" fill="#8caeb0" font-size="11">Send encoded bits between processes</text><text x="18" y="137" fill="#62e9ca" font-size="10" letter-spacing="1">SIGNALS · IPC · BITS</text>
