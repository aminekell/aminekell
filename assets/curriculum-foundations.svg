<g transform="translate(40 88)" font-family="monospace">
<rect width="350" height="160" rx="14" fill="#081720" stroke="#2b907f" stroke-opacity=".6"/><text x="18" y="32" fill="#eafff7" font-size="16" font-weight="700">BORN2BEROOT</text><text x="18" y="54" fill="#8caeb0" font-size="11">Harden a virtual Linux server</text><text x="18" y="137" fill="#62e9ca" font-size="10" letter-spacing="1">VM · USERS · FIREWALL</text>
<path d="M246 55l43-18 44 18-44 18z" fill="#1d5961" stroke="#63ffe1"/><path d="M246 55v53l43 18V73z" fill="#0d2c3a" stroke="#63ffe1"/><path d="M289 73v53l44-18V55z" fill="#174756" stroke="#63ffe1"/><path d="M256 64h23v7h-23zM256 77h23v7h-23zM256 90h23v7h-23z" fill="#7effd8" opacity=".72"/><path d="M309 78l13 5v12c0 12-9 19-13 21-4-2-13-9-13-21V83z" fill="#887aff" stroke="#c6bbff"/><path d="M303 92l5 5 9-11" fill="none" stroke="#fff" stroke-width="2"/>
</g>
<!-- Libft -->
<g transform="translate(425 88)" font-family="monospace">
<rect width="350" height="160" rx="14" fill="#081720" stroke="#2b907f" stroke-opacity=".6"/><text x="18" y="32" fill="#eafff7" font-size="16" font-weight="700">LIBFT</text><text x="18" y="54" fill="#8caeb0" font-size="11">Build reusable C building blocks</text><text x="18" y="137" fill="#62e9ca" font-size="10" letter-spacing="1">STRINGS · MEMORY · LISTS</text>
<path d="M245 82l34-16 34 16-34 16z" fill="#215360" stroke="#62ffe0"/><path d="M245 82v29l34 15V98z" fill="#0d2b38" stroke="#62ffe0"/><path d="M279 98v28l34-15V82z" fill="#164254" stroke="#62ffe0"/><path d="M279 66l34-16 34 16-34 16z" fill="#423b7b" stroke="#a897ff"/><path d="M313 82v29l34-15V66z" fill="#383467" stroke="#a897ff"/><path d="M313 82v29l-34 15V98z" fill="#27294f" stroke="#a897ff"/>
