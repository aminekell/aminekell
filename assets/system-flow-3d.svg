<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="330" viewBox="0 0 1100 330" role="img" aria-labelledby="title desc">
<title id="title">Animated 3D backend request flow</title><desc id="desc">An isometric animation shows a request moving from a client through a gateway and backend services to a database.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111e"/><stop offset="1" stop-color="#151329"/></linearGradient>
<linearGradient id="mint" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a0ffe9"/><stop offset="1" stop-color="#21bda9"/></linearGradient>
<linearGradient id="blue" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#197eb3"/><stop offset="1" stop-color="#12375f"/></linearGradient>
<linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ad8aff"/><stop offset="1" stop-color="#49358e"/></linearGradient>
<linearGradient id="edge" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#50efd0"/><stop offset=".5" stop-color="#6fa9ff"/><stop offset="1" stop-color="#bb8cff"/></linearGradient>
<pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#93a6ca" stroke-opacity=".06"/></pattern>
<filter id="glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1100" height="330" rx="24" fill="url(#bg)"/><rect width="1100" height="330" rx="24" fill="url(#grid)"/>
<text x="42" y="43" fill="#eaf5ff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="16" font-weight="800" letter-spacing="2">A REQUEST, MOVING THROUGH A SYSTEM</text><text x="1055" y="43" text-anchor="end" fill="#75efd5" font-family="ui-monospace, monospace" font-size="10" font-weight="700" letter-spacing="1.4">LIVE FLOW ●</text>
<path d="M216 141H374M476 141H634M736 141H894" fill="none" stroke="#64efd4" stroke-opacity=".45" stroke-width="2" stroke-dasharray="3 8"><animate attributeName="stroke-dashoffset" values="0;-22" dur="1.4s" repeatCount="indefinite"/></path>
<g filter="url(#glow)" fill="#eafffc"><circle r="4"><animateMotion dur="2.5s" repeatCount="indefinite" path="M216 141H374"/></circle><circle r="4"><animateMotion dur="2.8s" begin=".6s" repeatCount="indefinite" path="M476 141H634"/></circle><circle r="4"><animateMotion dur="2.7s" begin="1.1s" repeatCount="indefinite" path="M736 141H894"/></circle></g>
<g stroke="#d2fff7" stroke-opacity=".82" stroke-width="1.5">
<path d="M165 83L222 113L165 144L108 113Z" fill="url(#mint)"/><path d="M108 113L165 144V204L108 174Z" fill="url(#blue)"/><path d="M165 144L222 113V174L165 204Z" fill="url(#violet)"/>
<path d="M425 83L482 113L425 144L368 113Z" fill="url(#mint)"/><path d="M368 113L425 144V204L368 174Z" fill="url(#blue)"/><path d="M425 144L482 113V174L425 204Z" fill="url(#violet)"/>
<path d="M685 83L742 113L685 144L628 113Z" fill="url(#mint)"/><path d="M628 113L685 144V204L628 174Z" fill="url(#blue)"/><path d="M685 144L742 113V174L685 204Z" fill="url(#violet)"/>
<path d="M945 83L1002 113L945 144L888 113Z" fill="url(#mint)"/><path d="M888 113L945 144V204L888 174Z" fill="url(#blue)"/><path d="M945 144L1002 113V174L945 204Z" fill="url(#violet)"/>
</g>
<g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="800" letter-spacing="1" text-anchor="middle"><text x="165" y="118" fill="#0a3d3a">HTTP</text><text x="425" y="118" fill="#0a3d3a">ROUTE</text><text x="685" y="118" fill="#0a3d3a">API</text><text x="945" y="118" fill="#0a3d3a">SQL</text><text x="165" y="178" fill="#f4ffff">01</text><text x="425" y="178" fill="#f4ffff">02</text><text x="685" y="178" fill="#f4ffff">03</text><text x="945" y="178" fill="#f4ffff">04</text></g>
<g font-family="Inter, Segoe UI, Arial, sans-serif" text-anchor="middle"><text x="165" y="246" fill="#f2f7fc" font-size="13" font-weight="800" letter-spacing="1.2">CLIENT</text><text x="425" y="246" fill="#f2f7fc" font-size="13" font-weight="800" letter-spacing="1.2">GATEWAY</text><text x="685" y="246" fill="#f2f7fc" font-size="13" font-weight="800" letter-spacing="1.2">SERVICES</text><text x="945" y="246" fill="#f2f7fc" font-size="13" font-weight="800" letter-spacing="1.2">DATABASE</text><text x="165" y="267" fill="#9ab0c8" font-size="11">request</text><text x="425" y="267" fill="#9ab0c8" font-size="11">NGINX · routing</text><text x="685" y="267" fill="#9ab0c8" font-size="11">C · C++ · Java</text><text x="945" y="267" fill="#9ab0c8" font-size="11">PostgreSQL</text></g>
<path d="M42 292H1058" stroke="url(#edge)" stroke-opacity=".35"/><text x="42" y="313" fill="#7fead5" font-family="ui-monospace, monospace" font-size="10" font-weight="700" letter-spacing="1.2">REQUEST → ROUTE → PROCESS → STORE</text><text x="1058" y="313" text-anchor="end" fill="#8295ad" font-family="ui-monospace, monospace" font-size="10">SYSTEMS THINKING / 01</text>
</svg>
