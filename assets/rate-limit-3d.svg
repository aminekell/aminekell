<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">Packet Runner: an isometric token-bucket arcade scene</title>
<desc id="desc">A looping 3D-inspired game illustration of rate limiting. A glowing packet runner crosses an isometric network toward a token gate. Refilled tokens let requests reach the HTTP 200 route; excess traffic diverts to HTTP 429.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#050907"/><stop offset=".58" stop-color="#0A1114"/><stop offset="1" stop-color="#151022"/></linearGradient>
  <linearGradient id="floor" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0A2924"/><stop offset=".5" stop-color="#0C1A20"/><stop offset="1" stop-color="#17152A"/></linearGradient>
  <linearGradient id="lime" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#DFFF6B"/><stop offset="1" stop-color="#42E9B8"/></linearGradient>
  <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#9B83FF"/><stop offset="1" stop-color="#47DFFF"/></linearGradient>
  <linearGradient id="gate" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#D8FF72" stop-opacity=".85"/><stop offset=".5" stop-color="#53E8C3" stop-opacity=".72"/><stop offset="1" stop-color="#8D79FF" stop-opacity=".8"/></linearGradient>
  <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse" patternTransform="skewY(-22)"><path d="M38 0H0V38" fill="none" stroke="#8CFFE1" stroke-opacity=".12" stroke-width="1"/></pattern>
  <clipPath id="floorClip"><path d="M315 302 775 161 1165 300 703 454Z"/></clipPath>
  <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="12"/></filter>
</defs>
<rect x="1" y="1" width="1198" height="518" rx="22" fill="url(#bg)" stroke="#60EBC9" stroke-opacity=".44"/>
<path d="M2 150H1198" stroke="#63E9C8" stroke-opacity=".12"/>
<g fill="#DDFEFF" opacity=".52">
  <circle cx="370" cy="78" r="1.4"><animate attributeName="opacity" values=".2;.8;.2" dur="3.2s" repeatCount="indefinite"/></circle>
  <circle cx="850" cy="66" r="1.2"><animate attributeName="opacity" values=".8;.2;.8" dur="4.1s" repeatCount="indefinite"/></circle>
  <circle cx="1110" cy="125" r="1.5"><animate attributeName="opacity" values=".2;.9;.2" dur="2.8s" repeatCount="indefinite"/></circle>
  <circle cx="500" cy="121" r="1"/><circle cx="1025" cy="75" r="1"/>
</g>
<text x="54" y="57" fill="#9BFF75" font-family="Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="2.2">SYSTEMS QUEST / LEVEL 01</text>
<text x="52" y="108" fill="#F4F8F5" font-family="Arial,sans-serif" font-size="36" font-weight="800" letter-spacing=".4">PACKET</text>
<text x="52" y="148" fill="#F4F8F5" font-family="Arial,sans-serif" font-size="36" font-weight="800" letter-spacing=".4">RUNNER</text>
<text x="55" y="174" fill="#91AAA1" font-family="Arial,sans-serif" font-size="13">A token-bucket arcade map</text>
<rect x="53" y="207" width="247" height="179" rx="16" fill="#07110F" stroke="#64EAC7" stroke-opacity=".36"/>
<text x="75" y="238" fill="#91AAA1" font-family="Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="1.6">TOKEN GATE</text>
<text x="274" y="238" text-anchor="end" fill="#DFFF72" font-family="Arial,sans-serif" font-size="12" font-weight="700">03 / 03</text>
<circle cx="88" cy="275" r="13" fill="url(#lime)" filter="url(#glow)"><animate attributeName="r" values="11;13;11" dur="1.8s" repeatCount="indefinite"/></circle>
<circle cx="132" cy="275" r="13" fill="url(#lime)" filter="url(#glow)"><animate attributeName="r" values="13;11;13" dur="1.8s" repeatCount="indefinite"/></circle>
<circle cx="176" cy="275" r="13" fill="url(#lime)" filter="url(#glow)"><animate attributeName="r" values="11;13;11" dur="1.8s" begin="-.6s" repeatCount="indefinite"/></circle>
<path d="M75 309H277" stroke="#29423B" stroke-width="5" stroke-linecap="round"/>
<path d="M75 309H226" stroke="url(#lime)" stroke-width="5" stroke-linecap="round"><animate attributeName="stroke-dasharray" values="152 202;84 202;152 202" dur="4.2s" repeatCount="indefinite"/></path>
<circle cx="245" cy="343" r="4" fill="#DFFF72" filter="url(#glow)"/>
<text x="258" y="347" text-anchor="end" fill="#B7D4C7" font-family="Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="1.4">REFILLING</text>
<text x="75" y="370" fill="#71877F" font-family="Arial,sans-serif" font-size="10" letter-spacing="1">BURST CONTROL / ACTIVE</text>
<text x="55" y="430" fill="#61766E" font-family="Arial,sans-serif" font-size="10" letter-spacing="1.5">FOLLOW THE ROUTE</text>
<ellipse cx="733" cy="324" rx="410" ry="99" fill="#28E3B6" opacity=".07" filter="url(#softGlow)"/>
<path d="M315 302 775 161 1165 300 703 454Z" fill="url(#floor)" stroke="#58E6C6" stroke-opacity=".55" stroke-width="1.5"/>
<path d="M315 302 703 454V494L315 342Z" fill="#0B4138" stroke="#58E6C6" stroke-opacity=".34"/>
<path d="M703 454 1165 300V340L703 494Z" fill="#111B2B" stroke="#9B83FF" stroke-opacity=".32"/>
<g clip-path="url(#floorClip)" fill="none" stroke="#72F2D0" stroke-opacity=".17" stroke-width="1">
  <path d="M315 252 775 393M315 290 775 431M315 328 775 469M385 230 845 371M455 208 915 349M525 186 985 327M595 164 1055 305M665 142 1125 283"/>
  <path d="M390 455 850 314M465 478 925 337M540 501 1000 360M615 524 1075 383M690 547 1150 406M765 570 1225 429M840 593 1300 452M915 616 1375 475"/>
</g>
<path d="M345 300 505 350 650 306 720 277 838 238 960 276" fill="none" stroke="#59EFC6" stroke-width="3" stroke-opacity=".8" stroke-dasharray="5 10" filter="url(#glow)"><animate attributeName="stroke-dashoffset" values="0;-60" dur="2.4s" repeatCount="indefinite"/></path>
<path d="M700 318 802 357 923 326 1000 350" fill="none" stroke="#9B83FF" stroke-width="2.5" stroke-opacity=".8" stroke-dasharray="4 9"><animate attributeName="stroke-dashoffset" values="0;52" dur="2.8s" repeatCount="indefinite"/></path>
<g filter="url(#glow)">
  <circle r="5" fill="#E7FF8A"><animateMotion dur="2.8s" repeatCount="indefinite" path="M355 303 500 348 640 306"/></circle>
  <circle r="4" fill="#7DFFF0"><animateMotion dur="2.8s" begin="-.9s" repeatCount="indefinite" path="M355 303 500 348 640 306"/></circle>
  <circle r="4" fill="#DFFF72"><animateMotion dur="2.8s" begin="-1.8s" repeatCount="indefinite" path="M355 303 500 348 640 306"/></circle>
</g>
<ellipse cx="700" cy="245" rx="71" ry="19" fill="none" stroke="#DFFF72" stroke-opacity=".24" stroke-width="2"><animate attributeName="rx" values="55;71;55" dur="3.4s" repeatCount="indefinite"/></ellipse>
<path d="M657 250 700 229 743 250 700 272Z" fill="#193D31" stroke="#DFFF72" stroke-opacity=".8"/>
<path d="M657 250V304L700 327V272Z" fill="#0A5B46" stroke="#68F0C5" stroke-opacity=".8"/>
<path d="M700 272V327L743 304V250Z" fill="#263762" stroke="#9B83FF" stroke-opacity=".75"/>
<path d="M670 259 700 244 730 259V294L700 310 670 294Z" fill="none" stroke="url(#gate)" stroke-width="4" filter="url(#glow)"><animate attributeName="stroke-opacity" values=".45;1;.45" dur="2.2s" repeatCount="indefinite"/></path>
<text x="700" y="352" text-anchor="middle" fill="#BFEADD" font-family="Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="1.3">TOKEN GATE</text>
<g filter="url(#glow)">
  <circle r="8" fill="url(#lime)"><animateMotion dur="2.2s" repeatCount="indefinite" path="M700 183 700 218"/></circle>
  <circle r="7" fill="#C6FF77"><animateMotion dur="2.2s" begin="-.75s" repeatCount="indefinite" path="M700 183 700 218"/></circle>
  <circle r="6" fill="#55F3CF"><animateMotion dur="2.2s" begin="-1.5s" repeatCount="indefinite" path="M700 183 700 218"/></circle>
</g>
<g transform="translate(980 238)">
  <path d="M0 0 34-17 68 0 34 18Z" fill="#DFFF72" stroke="#F0FFB9" stroke-opacity=".8"/>
  <path d="M0 0V40L34 58V18Z" fill="#0A694E" stroke="#54EAC3" stroke-opacity=".8"/>
  <path d="M34 18V58L68 40V0Z" fill="#164766" stroke="#79DFFF" stroke-opacity=".7"/>
</g>
<text x="1058" y="257" fill="#C9FFE3" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1">HTTP 200</text>
<text x="1058" y="274" fill="#729187" font-family="Arial,sans-serif" font-size="10" letter-spacing="1.2">ALLOW</text>
<g transform="translate(955 335)">
  <path d="M0 0 26-13 52 0 26 14Z" fill="#8F7BFF" stroke="#C4B8FF" stroke-opacity=".75"/>
  <path d="M0 0V28L26 42V14Z" fill="#463B80" stroke="#A898FF" stroke-opacity=".75"/>
  <path d="M26 14V42L52 28V0Z" fill="#263564" stroke="#69E5F5" stroke-opacity=".7"/>
</g>
<text x="1022" y="354" fill="#C4B8FF" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="1">HTTP 429</text>
<text x="1022" y="371" fill="#8176AE" font-family="Arial,sans-serif" font-size="10" letter-spacing="1.2">SLOW DOWN</text>
<g>
  <animateMotion dur="7.5s" repeatCount="indefinite" path="M380 307 505 350 640 306 700 281 820 240 950 270"/>
  <g transform="translate(0 -25)">
    <path d="M-17-18 0-27 17-18 0-9Z" fill="#DFFF72" stroke="#F2FFC2"/>
    <path d="M-17-18V8L0 17V-9Z" fill="#087556" stroke="#74F8CB"/>
    <path d="M0-9V17L17 8V-18Z" fill="#1B4D6B" stroke="#82DEFF"/>
    <path d="M-8-18V-5M8-18V-5" stroke="#F7FFE9" stroke-width="3" stroke-linecap="round"/>
    <circle cx="0" cy="-20" r="3" fill="#FFFFFF" filter="url(#glow)"/>
    <animateTransform attributeName="transform" type="translate" values="0 -25;0 -29;0 -25" dur=".7s" repeatCount="indefinite" additive="sum"/>
  </g>
</g>
<g filter="url(#glow)">
  <circle r="4" fill="#9B83FF"><animateMotion dur="3.5s" repeatCount="indefinite" path="M710 322 805 359 922 327"/></circle>
  <circle r="3" fill="#C7B8FF"><animateMotion dur="3.5s" begin="-1.75s" repeatCount="indefinite" path="M710 322 805 359 922 327"/></circle>
</g>
<text x="354" y="280" fill="#9EB7AE" font-family="Arial,sans-serif" font-size="9" font-weight="700" letter-spacing="1.3">REQUEST BURST</text>
<text x="797" y="394" fill="#A99AFF" font-family="Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="1.3">OVER CAPACITY</text>
<text x="1116" y="480" text-anchor="end" fill="#60776E" font-family="Arial,sans-serif" font-size="9" letter-spacing="1.5">AUTO-LOOPING SVG / NO INPUT REQUIRED</text>
</svg>
