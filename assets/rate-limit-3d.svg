<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="370" viewBox="0 0 1200 370" role="img" aria-labelledby="title desc">
<title id="title">Token bucket rate limiting concept</title>
<desc id="desc">Requests flow into a three-dimensional token bucket. Requests with available tokens receive a 200 response; when the bucket is empty, requests are rate limited with a 429 response. Tokens refill over time.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="370" gradientUnits="userSpaceOnUse"><stop stop-color="#050907"/><stop offset=".56" stop-color="#081512"/><stop offset="1" stop-color="#11101A"/></linearGradient>
  <linearGradient id="top" x1="480" y1="90" x2="720" y2="190" gradientUnits="userSpaceOnUse"><stop stop-color="#D8FF76"/><stop offset="1" stop-color="#44EBC0"/></linearGradient>
  <linearGradient id="left" x1="480" y1="140" x2="600" y2="300" gradientUnits="userSpaceOnUse"><stop stop-color="#128C66"/><stop offset="1" stop-color="#082F27"/></linearGradient>
  <linearGradient id="right" x1="600" y1="140" x2="720" y2="300" gradientUnits="userSpaceOnUse"><stop stop-color="#168FA0"/><stop offset="1" stop-color="#173450"/></linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#88FFD8" stroke-opacity=".055"/></pattern>
  <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect x="1" y="1" width="1198" height="368" rx="22" fill="url(#bg)" stroke="#55EBC1" stroke-opacity=".35"/>
<rect x="2" y="2" width="1196" height="366" rx="21" fill="url(#grid)"/>
<text x="44" y="49" fill="#F1F8F3" font-family="Arial,sans-serif" font-size="21" font-weight="800" letter-spacing="2.4">RATE LIMITING / TOKEN BUCKET</text>
<text x="45" y="74" fill="#92AAA0" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1.3">SMOOTH BURSTS · BOUND SUSTAINED REQUEST RATE</text>
<rect x="1004" y="30" width="151" height="28" rx="14" fill="#0B2118" stroke="#96FF69" stroke-opacity=".52"/>
<circle cx="1022" cy="44" r="3.5" fill="#C6FF61" filter="url(#glow)"/>
<text x="1035" y="48" fill="#C9F7A0" font-family="Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="1">CONCEPT / 02</text>
<text x="65" y="138" fill="#C0D4C9" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1.2">REQUESTS</text>
<path d="M65 193H480" stroke="#5AE9C1" stroke-opacity=".42" stroke-width="2" stroke-dasharray="5 8"/>
<g fill="#C5FF66" filter="url(#glow)"><circle r="5"><animateMotion dur="2.8s" repeatCount="indefinite" path="M65 193H480"/></circle><circle r="3.5"><animateMotion dur="2.8s" begin="-.9s" repeatCount="indefinite" path="M65 193H480"/></circle><circle r="3"><animateMotion dur="2.8s" begin="-1.8s" repeatCount="indefinite" path="M65 193H480"/></circle></g>
<text x="65" y="232" fill="#82998D" font-family="Arial,sans-serif" font-size="12">A burst arrives</text>
<path d="M480 146 600 96 720 146 600 196Z" fill="url(#top)" stroke="#DFFFAB" stroke-opacity=".82"/>
<path d="M480 146 600 196V296L480 246Z" fill="url(#left)" stroke="#73FFC5" stroke-opacity=".68"/>
<path d="M600 196 720 146V246L600 296Z" fill="url(#right)" stroke="#73F4E8" stroke-opacity=".62"/>
<path d="M480 246 600 296 720 246" fill="none" stroke="#C7FFF0" stroke-opacity=".35"/>
<text x="600" y="153" text-anchor="middle" fill="#071B12" font-family="Arial,sans-serif" font-size="17" font-weight="900" letter-spacing="1.2">TOKEN BUCKET</text>
<g fill="#EEFFD0" stroke="#FFFFFF" stroke-opacity=".55"><circle cx="567" cy="172" r="7"/><circle cx="590" cy="162" r="7"/><circle cx="613" cy="172" r="7"/><circle cx="636" cy="162" r="7"/></g>
<text x="540" y="236" text-anchor="middle" fill="#E1FFE9" font-family="Arial,sans-serif" font-size="12" font-weight="700">CHECK</text>
<text x="662" y="236" text-anchor="middle" fill="#DDFBFF" font-family="Arial,sans-serif" font-size="12" font-weight="700">SPEND</text>
<circle cx="600" cy="196" r="5" fill="#F5FFE7" filter="url(#glow)"><animate attributeName="r" values="4;8;4" dur="2.2s" repeatCount="indefinite"/></circle>
<text x="600" y="326" text-anchor="middle" fill="#B6C7BA" font-family="Arial,sans-serif" font-size="12" letter-spacing="1.1">TOKENS REFILL OVER TIME</text>
<path d="M720 146C794 146 826 127 896 127H1110" fill="none" stroke="#77F59B" stroke-opacity=".62" stroke-width="2" stroke-dasharray="5 8"/>
<g fill="#B9FF62" filter="url(#glow)"><circle r="4"><animateMotion dur="2.4s" repeatCount="indefinite" path="M720 146C794 146 826 127 896 127H1110"/></circle></g>
<rect x="929" y="89" width="183" height="32" rx="16" fill="#0D2618" stroke="#90F47F" stroke-opacity=".58"/>
<circle cx="950" cy="105" r="4" fill="#B9FF62" filter="url(#glow)"/>
<text x="966" y="110" fill="#C8F6D4" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing=".8">ALLOWED / 200</text>
<text x="912" y="177" fill="#9EB4A5" font-family="Arial,sans-serif" font-size="12">token available</text>
<path d="M720 246C794 246 826 265 896 265H1110" fill="none" stroke="#B29BFF" stroke-opacity=".62" stroke-width="2" stroke-dasharray="5 8"/>
<g fill="#B7A0FF" filter="url(#glow)"><circle r="4"><animateMotion dur="2.8s" begin="-.7s" repeatCount="indefinite" path="M720 246C794 246 826 265 896 265H1110"/></circle></g>
<rect x="929" y="278" width="183" height="32" rx="16" fill="#1A1527" stroke="#A18BEA" stroke-opacity=".68"/>
<circle cx="950" cy="294" r="4" fill="#C19DFF" filter="url(#glow)"/>
<text x="966" y="299" fill="#E0D6FF" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing=".8">LIMITED / 429</text>
<text x="912" y="236" fill="#A59BB5" font-family="Arial,sans-serif" font-size="12">no token available</text>
<path d="M44 344H1156" stroke="#78EED4" stroke-opacity=".15"/>
<text x="45" y="359" fill="#70877A" font-family="Arial,sans-serif" font-size="10" letter-spacing="1.15">A SIMPLE CONTROL FOR FAIRER SHARED CAPACITY</text>
<text x="1155" y="359" text-anchor="end" fill="#70877A" font-family="Arial,sans-serif" font-size="10" letter-spacing="1.15">SYSTEMS THINKING / 02</text>
</svg>
