<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
<title id="title">Animated terminal view of the Inception Docker Compose configuration</title>
<desc id="desc">A neon terminal shows a Docker Compose inspection command, eight declared services, one bridge network, and two persistent bind-backed data volumes. This describes configuration, not live runtime status.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse"><stop stop-color="#050908"/><stop offset=".58" stop-color="#081311"/><stop offset="1" stop-color="#0D1018"/></linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse"><stop stop-color="#85FF68"/><stop offset=".55" stop-color="#43F2C4"/><stop offset="1" stop-color="#8A78FF"/></linearGradient>
  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#86F8C7" stroke-opacity=".055"/></pattern>
  <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect x="1" y="1" width="1198" height="298" rx="22" fill="url(#bg)" stroke="url(#edge)" stroke-opacity=".55" stroke-width="1.5"/>
<rect x="2" y="2" width="1196" height="296" rx="21" fill="url(#grid)"/>
<path d="M22 58H1178" stroke="#9CFFE0" stroke-opacity=".18"/>
<circle cx="30" cy="29" r="5" fill="#FF6C79"/><circle cx="50" cy="29" r="5" fill="#F6C95B"/><circle cx="70" cy="29" r="5" fill="#67E8A5"/>
<text x="92" y="33" fill="#A6B8AD" font-family="ui-monospace,Consolas,monospace" font-size="14" letter-spacing="1.4">AMINE@INCEPTION : ~/SRCS</text>
<text x="1160" y="33" text-anchor="end" fill="#63F3C3" font-family="ui-monospace,Consolas,monospace" font-size="11" font-weight="700" letter-spacing="1.2">CONFIG VIEW / 01</text>
<text x="54" y="101" fill="#75FF88" font-family="ui-monospace,Consolas,monospace" font-size="18" font-weight="700">$</text>
<text x="78" y="101" fill="#E7F4EC" font-family="ui-monospace,Consolas,monospace" font-size="18">docker compose config --services</text>
<rect x="447" y="82" width="2" height="23" fill="#B7FF5E" filter="url(#glow)"><animate attributeName="opacity" values="1;0;1" dur="1.15s" repeatCount="indefinite"/></rect>
<text x="54" y="141" fill="#82998D" font-family="ui-monospace,Consolas,monospace" font-size="12" letter-spacing="1.2">DECLARED TOPOLOGY</text>
<g transform="translate(54 162)">
  <rect width="326" height="81" rx="12" fill="#0B1C15" stroke="#74FF87" stroke-opacity=".42"/>
  <circle cx="25" cy="28" r="5" fill="#A9FF66" filter="url(#glow)"/>
  <text x="42" y="34" fill="#D9F8D0" font-family="ui-monospace,Consolas,monospace" font-size="16" font-weight="700">08</text>
  <text x="81" y="34" fill="#8CA79A" font-family="ui-monospace,Consolas,monospace" font-size="13" letter-spacing="1">SERVICES</text>
  <text x="22" y="62" fill="#A7C3B2" font-family="ui-monospace,Consolas,monospace" font-size="11">mariadb · wordpress · nginx · +5</text>
</g>
<g transform="translate(398 162)">
  <rect width="326" height="81" rx="12" fill="#0A1C1B" stroke="#4CEBC9" stroke-opacity=".42"/>
  <circle cx="25" cy="28" r="5" fill="#63FFE0" filter="url(#glow)"/>
  <text x="42" y="34" fill="#CFF8EF" font-family="ui-monospace,Consolas,monospace" font-size="16" font-weight="700">01</text>
  <text x="81" y="34" fill="#8DAAA3" font-family="ui-monospace,Consolas,monospace" font-size="13" letter-spacing="1">BRIDGE NETWORK</text>
  <text x="22" y="62" fill="#A8C9C1" font-family="ui-monospace,Consolas,monospace" font-size="11">inception_network</text>
</g>
<g transform="translate(742 162)">
  <rect width="404" height="81" rx="12" fill="#151326" stroke="#A28BFF" stroke-opacity=".42"/>
  <circle cx="25" cy="28" r="5" fill="#B5A1FF" filter="url(#glow)"/>
  <text x="42" y="34" fill="#E4DEFF" font-family="ui-monospace,Consolas,monospace" font-size="16" font-weight="700">02</text>
  <text x="81" y="34" fill="#A39AB9" font-family="ui-monospace,Consolas,monospace" font-size="13" letter-spacing="1">PERSISTENT DATA VOLUMES</text>
  <text x="22" y="62" fill="#C1B9D7" font-family="ui-monospace,Consolas,monospace" font-size="11">MariaDB + WordPress · bind-backed</text>
</g>
<path d="M54 267H1146" stroke="url(#edge)" stroke-opacity=".48" stroke-dasharray="3 8"/>
<circle r="3" fill="#C4FF63" filter="url(#glow)"><animateMotion dur="8s" repeatCount="indefinite" path="M54 267H1146"/></circle>
<text x="54" y="284" fill="#728A7D" font-family="ui-monospace,Consolas,monospace" font-size="10" letter-spacing="1.15">STATIC COMPOSE CONFIGURATION · NOT A LIVE RUNTIME STATUS</text>
<text x="1146" y="284" text-anchor="end" fill="#728A7D" font-family="ui-monospace,Consolas,monospace" font-size="10" letter-spacing="1.15">INCEPTION / FIELD NOTE 01</text>
</svg>
