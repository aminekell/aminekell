name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "portfolio/**"
      - "scripts/build.mjs"
      - "test/**"
      - "package.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify deterministic models
        run: npm test
      - name: Validate and stage static portfolio
        run: npm run build
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload portfolio
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
