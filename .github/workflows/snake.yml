name: Generate contribution snake

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: contribution-snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: aminekell
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23149B63
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%234BFF8C

      - name: Publish generated SVGs
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: [${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          publish_branch: output
