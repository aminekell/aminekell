name: Generate contribution snake

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: contribution-snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: aminekell
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23c13b16&color_dots=%23e5e3da,%23ead7c9,%23d7aa8e,%23c9825e,%23ad5937
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23e58a65&color_dots=%23292b2c,%2343312c,%23684333,%2392593d,%23c47c52

      - name: Publish generated SVGs
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          publish_branch: output
